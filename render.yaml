services:
  - type: web
    name: dropdoor-api
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: DATABASE_URL, sync: false}   # the Supabase connection string: set it in Render > Environment (a Blueprint never overwrites it)
      - {key: SECRET_KEY, generateValue: true}
      - {key: DEBUG, value: "0"}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_KEY, sync: false}
      - {key: SUPABASE_BUCKET, value: product-images}
      - {key: SUPABASE_ICON_BUCKET, value: icons}
      - {key: SMS_API_KEY, sync: false}      # BulkSMSBD key
      - {key: SMS_SENDER_ID, sync: false}
      - {key: CORS_ORIGINS, sync: false}     # the admin panel address, e.g. https://your-admin-panel.vercel.app (several: separate with commas)
      - {key: ADMIN_PASSWORD, sync: false}   # the admin login password (user name: dropdoor)
